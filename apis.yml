aid: thematic
name: Thematic
description: Thematic is a copyright-free music licensing platform that connects independent
  content creators with emerging artists. Creators get a permanent, no-cost license to use
  tracks in their videos in exchange for including a promotional link in the description,
  which activates YouTube Content ID whitelisting and prevents copyright claims across
  YouTube, TikTok, Instagram, Facebook, and podcasts. Premium ($9.99/mo) and Pro ($24.99/mo)
  plans unlock the full catalog, podcast licensing, and unlimited downloads. Co-founded with
  YouTube pioneer Michelle Phan, Thematic serves 1M+ creators and 10,000+ independent artists
  across 220+ countries. Thematic runs a consumer web and mobile app and does not currently
  publish a public developer API. Backed by 500 Global and Lux Capital.
